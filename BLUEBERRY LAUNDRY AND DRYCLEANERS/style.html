<!DOCTYPE html>

<head>

<title>Hover Icon Menu</title>
<style>
  /* Basic styling for the menu container */
  .nav-menu {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 250px;
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  /* Styling the buttons */
  .nav-btn {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #333;
    background-color: #f4f7fb;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    border: 1px solid #ccc;
    transition: all 0.3s ease;
    overflow: hidden;
  }

  /* The image/icon container (Hidden by default) */
  .nav-btn .icon {
    width: 0;
    opacity: 0;
    margin-right: 0;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
  }

  /* Setting the size and color of the SVG image */
  .nav-btn .icon svg {
    width: 20px;
    height: 20px;
    fill: #0b5ed7; /* Blueberry Laundry blue */
  }

  /* WHAT HAPPENS ON HOVER */
  .nav-btn:hover {
    background-color: #e9f2ff;
    border-color: #0b5ed7;
    color: #0b5ed7;
  }

  /* Reveal the image/icon on hover */
  .nav-btn:hover .icon {
    width: 20px;
    opacity: 1;
    margin-right: 12px;
  }
</style>
</head>
